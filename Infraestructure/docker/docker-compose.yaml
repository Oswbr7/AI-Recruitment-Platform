services:
  postgres:
    image: postgres:17
    container_name: recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitmentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitmentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - recruitment-network

  redis:
    image: redis:8
    container_name: recruitment-redis
    ports:
      - "6379:6379"
    networks:
      - recruitment-network

  rabbitmq:
    image: rabbitmq:4-management
    container_name: recruitment-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - recruitment-network

  auth-service:
    container_name: recruitment-auth-api
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: unless-stopped

  job-service:
    container_name: recruitment-job-api
    build:
      context: ../..
      dockerfile: services/job-service/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=jobservicedb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: unless-stopped

  candidate-service:
    container_name: recruitment-candidate-api
    build:
      context: ../..
      dockerfile: services/candidate-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=candidatedb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - recruitment-network
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  recruitment-network:
    driver: bridge