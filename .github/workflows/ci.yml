name: Continuous Integration

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:

  backend-validation:

    name: Backend Validation

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
          cache: true

      - name: Restore Dependencies
        run: dotnet restore AIRecruitmentPlatform.slnx

      - name: Build Solution
        run: dotnet build AIRecruitmentPlatform.slnx --no-restore --configuration Release

      # TODO: re-add a test step here once test projects exist in the repo.
      # Today there are none (backend or frontend), so `dotnet test` would
      # be a misleading no-op.

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
