services:
  postgres:
    image: postgres:17
    container_name: recruitment-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: recruitmentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d recruitmentdb"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend-network

  pgadmin:
    image: dpage/pgadmin4
    container_name: recruitment-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@recruitment.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend-network

  auth-service:
    container_name: recruitment-auth-api
    build:
      context: ../..
      dockerfile: services/auth-service/Dockerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - auth_logs:/app/logs
    networks:
      - backend-network
      - frontend-network
    restart: unless-stopped

  job-service:
    container_name: recruitment-job-api
    build:
      context: ../..
      dockerfile: services/job-service/Dockerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=jobservicedb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - job_logs:/app/logs
    networks:
      - backend-network
      - frontend-network
    restart: unless-stopped

  candidate-service:
    container_name: recruitment-candidate-api
    build:
      context: ../..
      dockerfile: services/candidate-service/Dockerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=candidatedb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - candidate_logs:/app/logs
    networks:
      - backend-network
      - frontend-network
    restart: unless-stopped

  company-service:
    container_name: recruitment-company-api
    build:
      context: ../..
      dockerfile: services/company-service/Dockerfile
    ports:
      - "5003:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=companydb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - company_logs:/app/logs
    networks:
      - backend-network
      - frontend-network
    restart: unless-stopped

  interview-service:
    container_name: recruitment-interview-api
    build:
      context: ../..
      dockerfile: services/interview-service/Dockerfile
    ports:
      - "5004:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=interviewdb;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - interview_logs:/app/logs
    networks:
      - backend-network
      - frontend-network
    restart: unless-stopped

  frontend:
    container_name: recruitment-frontend
    build:
      context: ../../frontend/web-app
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - auth-service
      - job-service
      - candidate-service
      - company-service
      - interview-service
    networks:
      - frontend-network
    restart: unless-stopped

volumes:
  postgres_data:
  auth_logs:
  job_logs:
  candidate_logs:
  company_logs:
  interview_logs:

networks:
  backend-network:
    driver: bridge
  frontend-network:
    driver: bridge
